[package]
edition = "2021"
rust-version = "1.87"
name = "rars"
version = "0.4.7"
description = "High-level Rust API for reading, extracting, writing, and repairing RAR archives (vendored fork with streaming RAR5 filter support)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitplane/rars"

[features]
fast = []
parallel = ["dep:rayon"]

[lib]
name = "rars"
path = "src/lib.rs"

[dependencies.aes]
version = "0.9"
features = ["zeroize"]

[dependencies.aho-corasick]
version = "1.1"

[dependencies.getrandom]
version = "0.4"

[dependencies.hmac]
version = "0.13"

[dependencies.rayon]
version = "1.12.0"
optional = true

[dependencies.sha1]
version = "0.11"

[dependencies.sha2]
version = "0.11"

[dependencies.zeroize]
version = "1.8"
features = [
    "alloc",
    "zeroize_derive",
]
default-features = false

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
