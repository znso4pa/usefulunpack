android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The release build merges native debug metadata for every .so in three ABIs;
# with 22 libraries that task ran the default heap out of space ("Java heap
# space" in mergeReleaseNativeDebugMetadata) and silently left a stale APK.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
