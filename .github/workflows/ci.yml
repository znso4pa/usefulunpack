name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Resource and UI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Shared UI and diagnostics boundaries
        run: |
          python3 scripts/check_ui_components.py --self-test
          python3 scripts/check_ui_components.py

      - name: Four-locale resources and help structure
        run: |
          python3 scripts/check_resources.py --self-test
          python3 scripts/check_resources.py

  android:
    name: Android host tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Set up Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Generate independent localization oracles
        run: |
          python3 scripts/localization_oracle.py --check-printf > "$RUNNER_TEMP/uu-localization-oracle.json"
          echo "UU_LOCALIZATION_ORACLE=$RUNNER_TEMP/uu-localization-oracle.json" >> "$GITHUB_ENV"

      # Host checks need neither release signing nor JNI binaries. This debug
      # assembly checks packaging only; it is not a distributable native app.
      - name: Unit tests, lint and debug assembly
        run: >-
          ./gradlew --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -XX:ActiveProcessorCount=2'
          -Pkotlin.compiler.execution.strategy=in-process
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-host-reports
          retention-days: 14
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # `crates/video-core` path-depends on the sibling v2video repo
      # (`../../../../v2video/crates/vc1` from the crate directory), which
      # resolves to `<runner work>/v2video` — one level above this repo's
      # checkout. Cargo resolves optional path deps even when the `v2v`
      # feature is off, so a lone checkout of this repo cannot load the
      # workspace at all. Clone the sibling into exactly that spot.
      - name: Check out sibling v2video repo
        run: |
          target="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/v2video"
          git clone --depth 1 https://github.com/znso4pa/v2videos.git "$target"
          echo "sibling at $target @ $(git -C "$target" rev-parse --short HEAD)"

      # Pinned to the 1.99 branch on purpose: clippy ships new deny-by-default
      # lints in every minor release, so `@stable` turns an upstream bump into a
      # red CI nobody asked for (already happened once — `panicking_overflow_checks`
      # in 1.99). Patch releases only carry fixes, so tracking `1.99` is safe;
      # bump the minor deliberately, together with a local
      # `cargo +<ver> clippy --workspace --all-targets`.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          # The action installs `--profile minimal` unless components are named,
          # and a pinned toolchain is not the preinstalled one, so clippy has to
          # be requested explicitly. (It only worked before by accident: the
          # hosted image ships stable+clippy, and `@stable` reused it.)
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # No committed Cargo.lock, so use a manual version to bust the cache.
          key: ${{ runner.os }}-cargo-v5

      - name: Workspace tests
        run: cargo test --workspace

      # Vendored forks are patched in via [patch.crates-io], not workspace
      # members — run their own test suites against the pinned baseline.
      - name: sevenz-rust fork tests
        run: cargo test --manifest-path crates/vendor/sevenz-rust/Cargo.toml

      - name: rars fork tests
        run: cargo test --manifest-path crates/vendor/rars/Cargo.toml

      - name: Clippy
        # Warnings surfaced but not fatal — vendored forks carry some upstream
        # warnings we keep as-is to minimize fork drift.
        run: cargo clippy --workspace --all-targets
