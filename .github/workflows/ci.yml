name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `crates/video-core` path-depends on the sibling v2video repo
      # (`../../../../v2video/crates/vc1` from the crate directory), which
      # resolves to `<runner work>/v2video` — one level above this repo's
      # checkout. Cargo resolves optional path deps even when the `v2v`
      # feature is off, so a lone checkout of this repo cannot load the
      # workspace at all. Clone the sibling into exactly that spot.
      - name: Check out sibling v2video repo
        run: |
          target="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/v2video"
          git clone --depth 1 https://github.com/znso4pa/v2videos.git "$target"
          echo "sibling at $target @ $(git -C "$target" rev-parse --short HEAD)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # No committed Cargo.lock, so use a manual version to bust the cache.
          key: ${{ runner.os }}-cargo-v5

      - name: Workspace tests
        run: cargo test --workspace

      # Vendored forks are patched in via [patch.crates-io], not workspace
      # members — run their own test suites against the pinned baseline.
      - name: sevenz-rust fork tests
        run: cargo test --manifest-path crates/vendor/sevenz-rust/Cargo.toml

      - name: rars fork tests
        run: cargo test --manifest-path crates/vendor/rars/Cargo.toml

      - name: Clippy
        # Warnings surfaced but not fatal — vendored forks carry some upstream
        # warnings we keep as-is to minimize fork drift.
        run: cargo clippy --workspace --all-targets
