android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The release build merges native debug metadata for every .so in three ABIs;
# with 22 libraries that task ran the default heap out of space ("Java heap
# space" in mergeReleaseNativeDebugMetadata) and silently left a stale APK.
#
# `-Dfile.encoding=UTF-8` 是钉死守护进程身份用的，不是给编译用的：Gradle 把 JVM
# 参数当作守护进程的兼容性判据，而从终端 / VS Code / 别的工具启动时 JVM 推导出的
# 默认编码会不一样（实测出现 `utf8` 与 `UTF-8` 两种），于是**同时留着两个 4 GB 的
# 守护进程**，内存直接翻倍。钉死之后任何入口都复用同一个。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin 编译跑在**另一个**守护进程里，但它默认继承上面的 jvmargs —— 于是
# 一次 `./gradlew test` 会同时留下两个 4 GB 的常驻进程（实测堆占用合计 ~3.5 GB）。
# 上面那个 4 GB 是为 mergeReleaseNativeDebugMetadata 要的，Kotlin 编译不需要，
# 单独收窄；真不够时 Kotlin 会明确报 OOM，再往上调即可。
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# 空闲 1 小时回收守护进程（默认 3 小时）。长驻是有意的（省掉每次冷启动），
# 但不该长到用户已经忘了它在——那正是「Java 进程莫名占了几个 G」的来源。
org.gradle.daemon.idletimeout=3600000
