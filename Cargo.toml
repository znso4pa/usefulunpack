[workspace]
members = [
    "crates/common",
    "crates/xp3-core",
    "crates/pfs-core",
    "crates/nsa-core",
    "crates/iso-core",
    "crates/ypf-core",
    "crates/zip-core",
    "crates/sevenz-core",
    "crates/rar-core",
    "crates/lz4-core",
    "crates/gzip-core",
    "crates/bzip2-core",
    "crates/xz-core",
    "crates/zstd-core",
    "crates/lzma-core",
    "crates/tar-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "s"
strip = true
lto = true

# Local fork of rars with streaming RAR5 filter support
# (upstream refuses to stream filtered members over the buffered-decode limit)
[patch.crates-io]
rars = { path = "crates/vendor/rars" }
